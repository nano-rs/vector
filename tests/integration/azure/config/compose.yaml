version: "3"

services:
  local-azure-blob:
    image: mcr.microsoft.com/azure-storage/azurite:${CONFIG_VERSION}
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --loose
    volumes:
      - /var/run:/var/run

  eventhubs-emulator:
    image: mcr.microsoft.com/azure-messaging/eventhubs-emulator:${EVENTHUBS_EMULATOR_VERSION:-2.2.1}
    environment:
      BLOB_SERVER: local-azure-blob
      METADATA_SERVER: local-azure-blob
      ACCEPT_EULA: "Y"
    volumes:
      - ./eventhubs-emulator.json:/Eventhubs_Emulator/ConfigFiles/Config.json
    depends_on:
      - local-azure-blob

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:${CONFIG_VERSION}
    command: azurite --skipApiVersionCheck --blobHost 0.0.0.0 --blobPort 14430 --queuePort 14431 --tablePort 14432 --loose --oauth basic --cert /certs/azurite-chain.cert.pem --key /private/azurite.key.pem
    volumes:
      - /var/run:/var/run
      - ../../../data/ca/intermediate_server/certs:/certs
      - ../../../data/ca/intermediate_server/private/azurite.key.pem:/private/azurite.key.pem

networks:
  default:
    name: ${VECTOR_NETWORK}
    external: true
