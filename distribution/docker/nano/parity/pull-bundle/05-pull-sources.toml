# NAN-3371/NAN-3372 loss accounting (nano-pull-loss-fence-v1): a discard the source
# keeps for the customer's DLQ is not loss. The pull Worker scrapes only this
# exporter (scrapes are metered egress); the rule is pull.rs LOSS_FENCE_CONTRACT.
[sources.nano_pull_loss_metrics]
type = "internal_metrics"
scrape_interval_secs = 10
namespace = "nanosiem_pull"

[transforms.nano_pull_loss_select]
type = "filter"
inputs = ["nano_pull_loss_metrics"]
condition = '''
component = to_string(.tags.component_id) ?? ""
pull = starts_with(component, "nano_pull_") && !starts_with(component, "nano_pull_loss_")
.name == "component_discarded_events_total" ||
  (component == "nano_pull_loss_metrics" && .name == "component_sent_events_total") ||
  (pull && includes(["component_received_events_total", "component_errors_total",
    "sqs_message_received_messages_total", "sqs_message_delete_succeeded_total",
    "sqs_message_delete_failed_total", "sqs_message_processing_succeeded_total"], .name)) ||
  (component == "ocsf_parquet_bronze" && includes(["component_sent_events_total", "component_errors_total"], .name))
'''

[sinks.nano_pull_loss_exporter]
type = "prometheus_exporter"
inputs = ["nano_pull_loss_select"]
address = "0.0.0.0:9597"
default_namespace = "nanosiem_pull"
