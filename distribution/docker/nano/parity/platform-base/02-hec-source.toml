# Splunk HEC Source
# Accepts events on the Splunk HTTP Event Collector wire format so existing
# Splunk forwarders / agents can be repointed at nano without rewriting their
# config. Port 8088 is the standard HEC port.
#
# Auth: shares VECTOR_AUTH_TOKEN with the HTTP and Vector-native ingest paths.
# (One token to rotate for ops simplicity in OOTB open-core deployments.)

[sources.splunk_hec_ingest]
type = "splunk_hec"
address = "0.0.0.0:8088"
valid_tokens = ["parity-not-a-secret:nano-source-v1:apache_access", "parity-not-a-secret:nano-source-v1:aws_cloudtrail", "parity-not-a-secret:nano-source-v1:conduit_proxy", "parity-not-a-secret:nano-source-v1:otlp_log", "parity-not-a-secret:nano-source-v1:unknown", "parity-not-a-secret:nano-source-v1:windows_event", "parity-not-a-secret:nano-source-v1:windows_sysmon"]
acknowledgements.enabled = true
store_hec_token = true

# =============================================================================
# HEC Normalization
# Splunk HEC events arrive with structure:
#   { "event": <object|string>, "sourcetype": "...", "source": "...",
#     "host": "...", "time": <epoch>, "index": "...", "fields": {...} }
# We flatten this into the same shape the rest of the pipeline expects.
# =============================================================================
[transforms.hec_normalize]
type = "remap"
drop_on_abort = true
drop_on_error = true
inputs = ["splunk_hec_ingest"]
source = '''
# valid_tokens on the source already enforced auth — mark and move on.
.auth_status = "authenticated"
hec_token = to_string(get_secret("splunk_hec_token"))
expected_token = get_env_var("VECTOR_AUTH_TOKEN") ?? ""
bound_prefix = expected_token + ":nano-source-v1:"
if expected_token == "" || !starts_with(hec_token, bound_prefix) { abort }
authorized_source = replace(hec_token, bound_prefix, "", count: 1)
if !includes(["apache_access", "aws_cloudtrail", "conduit_proxy", "otlp_log", "unknown", "windows_event", "windows_sysmon"], authorized_source) { abort }
tenant_id = downcase(get_env_var("NANO_TENANT_ID") ?? "")
if tenant_id == "" { abort }
%tenant_id = tenant_id
removed_hec_token = remove_secret("splunk_hec_token")
if !is_null(removed_hec_token) { abort }

# NAN-2596: the sending credential, from the Worker-authenticated request
# channel `nano-credential-v1.<id>.<mac>.<receipt>` (MAC = HMAC-SHA256 keyed
# by the private delivery token). Read before any `.event` lift.
nano_channel = to_string(.splunk_channel) ?? ""
nano_credential_id = ""
if starts_with(nano_channel, "nano-credential-v1.") {
    nano_channel_parts = split(nano_channel, ".", limit: 4)
    nano_candidate = string(nano_channel_parts[1]) ?? ""
    nano_mac = string(nano_channel_parts[2]) ?? ""
    nano_expected_mac = slice(encode_base16(hmac("nanosiem.credential-attribution.v1:" + nano_candidate, expected_token)), 0, 32) ?? ""
    if nano_mac != "" && nano_mac == nano_expected_mac && match(nano_candidate, r'^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$') {
        nano_credential_id = nano_candidate
    }
}
%nano_credential_id = nano_credential_id

# The source validated a private delivery token, never a customer token.
# Ignore producer sourcetype/event/fields values for source authorization.
source_type = authorized_source
.source_type = source_type

# Splunk's .event holds the actual log payload. Lift it into .message
# (raw forms) or merge its keys (structured forms) so downstream parsers
# see the same shape as HTTP-ingested events.
#
# Reserved root keys must not be lifted from .event — otherwise a Splunk
# forwarder can clobber routing-critical fields (.source_type, .namespace,
# .auth_status, etc.) and bypass per-parser HEC filters that fire on
# source_type. NAN-938.
if exists(.event) {
    if is_object(.event) {
        reserved = ["source_type", "namespace", "auth_status", "timestamp",
                    "metadata", "ingest_time", "_inserted_at", "id", "ext",
                    "message", "sourcetype", "splunk_sourcetype",
                    "content_format", "routing_timestamp"]
        event_keys = keys(object!(.event))
        for_each(event_keys) -> |_idx, key| {
            if !includes(reserved, key) {
                val, get_err = get(.event, [key])
                if get_err == null && val != null {
                    . = set!(., [key], val)
                }
            }
        }
        if exists(.event.message) && is_string(.event.message) {
            .message = to_string!(.event.message)
        } else {
            .message = encode_json(.event)
        }
    } else if is_string(.event) {
        .message = to_string!(.event)
    } else {
        .message = encode_json(.event)
    }
    del(.event)
}

if !exists(.message) {
    .message = ""
}

.content_format = "splunk_hec"
.routing_timestamp = now()

if !is_object(.metadata) {
    .metadata = {}
}
.metadata.forwarded_via = "splunk_hec"

# NAN-2370: stash the routing key into Vector EVENT METADATA, exactly as
# `source_type_extract` does in 00-base.toml. The OCSF parsers replace the event
# root (`. = {OCSF object}`), which wipes `.source_type`, and the generated
# `_ocsf_prepare` reads `%source_type` back to stamp `metadata.log_source`.
#
# This lane feeds `source_router` DIRECTLY and never passes through
# `source_type_extract`, so without this every HEC-ingested OCSF row lands with
# `metadata.log_source = "unknown"` — unsearchable by source and
# indistinguishable from genuinely unattributed data. Same defect and same fix
# as the OTLP lane in 03-otlp-source.toml.
#
# `.source_type` is assigned a String above, so `to_string` is infallible here:
# coalescing it is an E651 compile error that fails the whole reload, and Vector
# restores the old topology so the edit silently looks like a no-op.
%source_type = downcase(to_string!(.source_type))
'''
