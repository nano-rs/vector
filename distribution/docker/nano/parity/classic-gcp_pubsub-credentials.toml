# Parity config (NAN-3604): the classic / open-core source generator output
# (nanosiem-core source_configs/service.rs generate_source_block + routing transform), rendered at
# runtime from toml::Table. Synthetic placeholders only: .invalid hosts, inert credentials.
# generate_gcp_pubsub_source with a service-account key written by the creds backend.

[sources.parity_pubsub_source]
type = "gcp_pubsub"
project = "parity-project"
subscription = "parity-subscription"
ack_deadline_secs = 600
credentials_path = "/etc/vector/source-creds/parity-gcp.json"

[transforms.parity_pubsub_route]
type = "remap"
inputs = ["parity_pubsub_source"]
source = '''
.source_type = "parity_gcp_feed"
'''

[sinks.parity_out]
type = "blackhole"
inputs = ["parity_pubsub_route"]
