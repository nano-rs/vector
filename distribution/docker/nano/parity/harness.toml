# Parity config: the shapes nanosiem's test harnesses run this image with
# (stdin -> route -> blackhole; scripts/verify-vector-generation-rollback.sh:
# demo_logs -> remap -> blackhole; stdin -> console).
[sources.events]
type = "stdin"

[sources.sentinel]
type = "demo_logs"
format = "shuffle"
lines = ["generation-sentinel"]
interval = 1.0

[transforms.source_router]
type = "route"
inputs = ["events"]

[transforms.source_router.route]
tenant__pipe_native = "true"

[transforms.stamp]
type = "remap"
inputs = ["sentinel"]
source = '.generation = "parity"'

[sinks.test]
type = "blackhole"
inputs = ["source_router.tenant__pipe_native", "stamp"]

[sinks.out]
type = "console"
inputs = ["source_router._unmatched"]
encoding.codec = "json"
