name: nano OTLP check

on:
  pull_request:
    branches: [nano/v0.59]
  push:
    branches: [fix/NAN-3959-otlp-trace-logs]

permissions:
  contents: read

concurrency:
  group: nano-otlp-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codecs:
    name: OTLP codec tests and Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake libclang-dev libssl-dev libxxhash-dev pkg-config protobuf-compiler
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - name: Check codec and test targets
        run: cargo check --locked -p codecs --no-default-features --features opentelemetry --tests
      - name: Run OTLP protobuf regression tests
        run: cargo test --locked -p codecs --no-default-features --features opentelemetry --lib encoding::format::otlp::tests -- --nocapture
      - name: Clippy
        run: cargo clippy --locked -p codecs --no-default-features --features opentelemetry --tests -- -D warnings
